<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f0f1a">
<title>Seb Blast!</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: none; user-select: none; }
  :root {
    --bg: #0f0f1a;
    --bg2: #1a1a2e;
    --bg3: #16213e;
    --accent: #e94560;
    --gold: #f0a500;
    --cell: 38px;
    --gap: 2px;
  }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); font-family: 'Segoe UI', system-ui, sans-serif; }

  #app { display: flex; flex-direction: column; align-items: center; height: 100dvh; padding: 4px 8px 0; gap: 4px; }

  /* Title */
  #title {
    font-size: 22px;
    font-weight: 900;
    letter-spacing: 3px;
    text-transform: uppercase;
    background: linear-gradient(135deg, #f0a500, #e94560, #9b59b6);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1;
    padding: 2px 0;
    filter: drop-shadow(0 0 8px rgba(233,69,96,0.4));
  }

  /* Header */
  #header { width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 2px 8px; }
  #score-box { text-align: center; }
  #score-label { font-size: 10px; color: #888; letter-spacing: 2px; text-transform: uppercase; }
  #score { font-size: 26px; font-weight: 700; color: #fff; line-height: 1; }
  #best-box { text-align: center; }
  #best-label { font-size: 10px; color: #888; letter-spacing: 2px; text-transform: uppercase; }
  #best { font-size: 18px; font-weight: 600; color: var(--gold); line-height: 1; }
  #combo-box { text-align: center; min-width: 70px; }
  #combo { font-size: 13px; font-weight: 700; color: var(--accent); min-height: 18px; }
  #level-box { font-size: 11px; color: #aaa; line-height: 1; margin: 1px 0; }
  #level-label { letter-spacing: 1px; text-transform: uppercase; font-size: 9px; color: #666; }
  #level-val { font-size: 15px; font-weight: 700; color: #fff; }

  /* Mute button */
  #mute-btn {
    position: absolute;
    top: 6px; right: 8px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 20px;
    color: #aaa;
    font-size: 16px;
    padding: 4px 10px;
    cursor: pointer;
    z-index: 10;
  }

  /* Grid */
  #grid-wrap { position: relative; }
  #grid {
    display: grid;
    grid-template-columns: repeat(8, var(--cell));
    grid-template-rows: repeat(8, var(--cell));
    gap: var(--gap);
    background: var(--bg2);
    border-radius: 12px;
    padding: 6px;
    border: 1px solid #2a2a4a;
  }
  .cell {
    width: var(--cell);
    height: var(--cell);
    border-radius: 6px;
    background: var(--bg3);
    border: 1px solid #1e1e3a;
    position: relative;
    overflow: hidden;
  }
  .cell.filled { border: 1px solid rgba(255,255,255,0.1); }
  .cell.filled::after {
    content: '';
    position: absolute;
    top: 2px; left: 2px; right: 2px;
    height: 35%;
    border-radius: 4px 4px 0 0;
    background: rgba(255,255,255,0.25);
  }
  .cell.highlight { background: rgba(255,255,255,0.15) !important; border: 1px solid rgba(255,255,255,0.3) !important; }
  .cell.invalid { background: rgba(233,69,96,0.2) !important; border: 1px solid rgba(233,69,96,0.4) !important; }
  .cell.clearing { animation: clearPop 0.35s ease forwards; }
  @keyframes clearPop {
    0% { transform: scale(1); }
    40% { transform: scale(1.15); filter: brightness(2); }
    100% { transform: scale(0); opacity: 0; }
  }
  .cell.flash-row { animation: flashRow 0.15s ease; }
  @keyframes flashRow {
    0%,100% { filter: brightness(1); }
    50% { filter: brightness(2.5); }
  }
  #grid-wrap.shake-sm { animation: shakeSm 0.35s ease; }
  #grid-wrap.shake-md { animation: shakeMd 0.4s ease; }
  #grid-wrap.shake-lg { animation: shakeLg 0.5s ease; }
  @keyframes shakeSm {
    0%,100% { transform: translate(0,0); }
    20% { transform: translate(-4px, 2px); }
    40% { transform: translate(4px, -2px); }
    60% { transform: translate(-3px, 1px); }
    80% { transform: translate(3px, -1px); }
  }
  @keyframes shakeMd {
    0%,100% { transform: translate(0,0); }
    15% { transform: translate(-7px, 3px); }
    30% { transform: translate(7px, -3px); }
    45% { transform: translate(-5px, 4px); }
    60% { transform: translate(6px, -2px); }
    75% { transform: translate(-4px, 2px); }
    90% { transform: translate(3px, -1px); }
  }
  @keyframes shakeLg {
    0%,100% { transform: translate(0,0) rotate(0deg); }
    10% { transform: translate(-10px, 4px) rotate(-1deg); }
    25% { transform: translate(10px, -4px) rotate(1deg); }
    40% { transform: translate(-8px, 5px) rotate(-0.8deg); }
    55% { transform: translate(9px, -3px) rotate(0.8deg); }
    70% { transform: translate(-6px, 3px) rotate(-0.4deg); }
    85% { transform: translate(5px, -2px) rotate(0.3deg); }
  }

  .score-pop {
    position: absolute;
    pointer-events: none;
    font-size: 18px;
    font-weight: 700;
    color: var(--gold);
    text-shadow: 0 0 8px var(--gold);
    animation: floatUp 0.9s ease forwards;
    z-index: 100;
    white-space: nowrap;
  }
  @keyframes floatUp {
    0% { opacity: 1; transform: translateY(0) scale(1); }
    100% { opacity: 0; transform: translateY(-60px) scale(1.2); }
  }
  .sebtacular-pop {
    position: fixed;
    pointer-events: none;
    left: 50%;
    top: 38%;
    transform: translateX(-50%) scale(0);
    z-index: 300;
    font-size: 28px;
    font-weight: 900;
    letter-spacing: 1px;
    white-space: nowrap;
    background: rgba(10, 8, 20, 0.88);
    border: 2px solid rgba(240, 165, 0, 0.6);
    border-radius: 40px;
    padding: 10px 24px;
    box-shadow: 0 4px 32px rgba(0,0,0,0.7), 0 0 20px rgba(240,165,0,0.25);
    animation: sebtacularPop 1.6s cubic-bezier(0.22,1,0.36,1) forwards;
  }
  .sebtacular-pop span {
    background: linear-gradient(135deg, #f0a500, #e94560, #9b59b6, #f0a500);
    background-size: 200% auto;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(0 0 6px rgba(240,165,0,0.6));
  }
  @keyframes sebtacularPop {
    0%   { transform: translateX(-50%) scale(0) rotate(-8deg); opacity: 0; }
    18%  { transform: translateX(-50%) scale(1.25) rotate(3deg); opacity: 1; }
    30%  { transform: translateX(-50%) scale(0.95) rotate(-1deg); opacity: 1; }
    42%  { transform: translateX(-50%) scale(1.08) rotate(1deg); opacity: 1; }
    60%  { transform: translateX(-50%) scale(1) rotate(0deg); opacity: 1; }
    80%  { transform: translateX(-50%) scale(1) rotate(0deg); opacity: 1; }
    100% { transform: translateX(-50%) scale(0.8) rotate(0deg) translateY(-30px); opacity: 0; }
  }

  /* Piece tray */
  #tray {
    width: 100%;
    display: flex;
    justify-content: space-around;
    align-items: center;
    padding: 6px 4px;
    background: #2a2a4a;
    border-radius: 12px;
    border: 1px solid #3a3a6a;
    min-height: 90px;
    flex: 0 0 auto;
  }
  .piece-slot {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 30%;
    min-height: 80px;
    cursor: pointer;
    transition: transform 0.15s;
    position: relative;
  }
  .piece-slot.used { opacity: 0.15; pointer-events: none; }
  .piece-grid { display: grid; gap: 2px; }
  .piece-cell {
    width: 20px; height: 20px;
    border-radius: 4px;
    border: none;
    background: transparent;
    position: relative;
    overflow: hidden;
  }
  .piece-cell.filled {
    border: 1px solid rgba(255,255,255,0.1);
  }
  .piece-cell.filled::after {
    content: '';
    position: absolute;
    top: 2px; left: 2px; right: 2px;
    height: 35%;
    border-radius: 3px 3px 0 0;
    background: rgba(255,255,255,0.25);
  }

  /* Ghost drag */
  #ghost {
    position: fixed;
    pointer-events: none;
    z-index: 999;
    display: none;
    opacity: 0.9;
  }
  #ghost .piece-grid { gap: 2px; }
  #ghost .piece-cell { width: var(--cell); height: var(--cell); border-radius: 6px; overflow: hidden; transition: box-shadow 0.1s; background: transparent; border: none; position: relative; }
  #ghost .piece-cell.filled { border: 1px solid rgba(255,255,255,0.1); }
  #ghost.valid .piece-cell.filled   { box-shadow: 0 0 8px rgba(39,174,96,0.8), inset 0 0 0 2px rgba(39,174,96,0.6); }
  #ghost.valid .piece-cell.filled::after { background: rgba(255,255,255,0.3); }
  #ghost.invalid .piece-cell.filled { box-shadow: 0 0 8px rgba(231,76,60,0.8), inset 0 0 0 2px rgba(231,76,60,0.7); }
  #ghost.invalid .piece-cell.filled::after { background: rgba(255,255,255,0.2); }

  /* Game over overlay */
  #gameover {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.88);
    z-index: 200;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
  }
  #gameover.show { display: flex; }
  #gameover h1 { font-size: 34px; color: var(--accent); font-weight: 900; letter-spacing: 3px; }
  #gameover .final { font-size: 17px; color: #aaa; }
  #gameover .final span { color: #fff; font-weight: 700; font-size: 22px; }
  #restart-btn {
    padding: 14px 42px;
    background: var(--accent);
    color: #fff;
    font-size: 18px;
    font-weight: 800;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    letter-spacing: 2px;
    box-shadow: 0 4px 24px rgba(233,69,96,0.5);
  }

  /* Colors */
  .c0 { background: #e74c3c; }
  .c1 { background: #e67e22; }
  .c2 { background: #f1c40f; }
  .c3 { background: #2ecc71; }
  .c4 { background: #1abc9c; }
  .c5 { background: #3498db; }
  .c6 { background: #9b59b6; }
  .c7 { background: #e91e63; }
  .c8 { background: #00bcd4; }
  .c9 { background: #f0a500; }

</style>

<body>
<div id="app">
  <div id="title">Seb Blast!</div>
  <div id="header">
    <div id="score-box">
      <div id="score-label">Score</div>
      <div id="score">0</div>
    </div>
    <div id="combo-box">
      <div id="mode-badge" style="display:none"></div>
      <div id="level-box"><span id="level-label">LVL</span> <span id="level-val">1</span></div>
      <div id="combo"></div>
    </div>
    <div id="best-box">
      <div id="best-label">Best</div>
      <div id="best">0</div>
    </div>
  </div>
  <div id="grid-wrap">
    <div id="grid"></div>
  </div>
  <div id="tray"></div>
</div>

<button id="mute-btn" title="Toggle sound">🔊</button>
<div id="ghost"><div class="piece-grid" id="ghost-grid"></div></div>

<div id="gameover">
  <h1>GAME OVER</h1>
  <div class="final">Score: <span id="final-score">0</span></div>
  <div class="final">Best: <span id="final-best">0</span></div>
  <button id="restart-btn">PLAY AGAIN</button>
</div>



<script>
// ─── Audio Engine (Web Audio API) ────────────────────────────────────────────
let audioCtx = null;
let muted = false;

function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function playTone(type, freq, duration, volume = 0.3, fadeOut = true) {
  if (muted) return;
  try {
    const ctx = getAudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.type = type;
    osc.frequency.setValueAtTime(freq, ctx.currentTime);
    gain.gain.setValueAtTime(volume, ctx.currentTime);
    if (fadeOut) gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + duration);
  } catch(e) {}
}

function playChord(freqs, type, duration, volume = 0.18) {
  freqs.forEach(f => playTone(type, f, duration, volume));
}

// Block drop: satisfying thud
function soundDrop() {
  if (muted) return;
  try {
    const ctx = getAudioCtx();
    // Low thud using noise burst
    const buf = ctx.createBuffer(1, ctx.sampleRate * 0.08, ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / data.length);
    const src = ctx.createBufferSource();
    src.buffer = buf;
    const filter = ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 200;
    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0.4, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.12);
    src.connect(filter);
    filter.connect(gain);
    gain.connect(ctx.destination);
    src.start();
    // Short click on top
    playTone('sine', 120, 0.06, 0.25);
  } catch(e) {}
}

// Single line clear: ascending sweep
function soundLineClear(lineCount) {
  if (muted) return;
  try {
    const ctx = getAudioCtx();
    const notes = lineCount >= 4 ? [523, 659, 784, 1047, 1319] :
                  lineCount >= 3 ? [523, 659, 784, 1047] :
                  lineCount >= 2 ? [523, 659, 784] : [523, 659];
    notes.forEach((freq, i) => {
      setTimeout(() => playTone('square', freq, 0.18, 0.22), i * 55);
    });
    // Explosion crackle
    setTimeout(() => {
      const buf = ctx.createBuffer(1, ctx.sampleRate * 0.25, ctx.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / data.length, 1.5);
      const src = ctx.createBufferSource();
      src.buffer = buf;
      const bpf = ctx.createBiquadFilter();
      bpf.type = 'bandpass';
      bpf.frequency.value = 1200;
      bpf.Q.value = 0.5;
      const gain = ctx.createGain();
      gain.gain.setValueAtTime(0.35, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);
      src.connect(bpf);
      bpf.connect(gain);
      gain.connect(ctx.destination);
      src.start();
    }, notes.length * 55);
  } catch(e) {}
}

// Combo: triumphant arpeggio
function soundCombo(count) {
  if (muted) return;
  const scales = [
    [523, 659, 784],
    [659, 784, 988, 1047],
    [784, 988, 1047, 1319, 1568],
  ];
  const notes = scales[Math.min(count - 2, scales.length - 1)];
  notes.forEach((freq, i) => {
    setTimeout(() => playTone('sawtooth', freq, 0.2, 0.18), i * 70);
  });
}

// Game over: descending sad tones
function soundGameOver() {
  if (muted) return;
  [440, 370, 311, 261].forEach((freq, i) => {
    setTimeout(() => playTone('sawtooth', freq, 0.4, 0.2), i * 160);
  });
}

// Drag pickup: light tick
function soundPickup() {
  playTone('sine', 880, 0.06, 0.12);
}

document.getElementById('mute-btn').addEventListener('click', () => {
  muted = !muted;
  document.getElementById('mute-btn').textContent = muted ? '🔇' : '🔊';
});

// ─── Game Logic ───────────────────────────────────────────────────────────────
const COLS = 8, ROWS = 8;
const LEVEL_THRESHOLD = 200; // ~100 moves per level at 2pts per cell
let board = [], score = 0, best = 0, level = 1, pieces = [], dragging = null,
    dragPieceIdx = -1, comboCount = 0, levelUpInProgress = false, processing = false;

// ── Piece pool ────────────────────────────────────────────────────────────────
// Block Blast philosophy: pieces are always individually placeable on the current
// board. No sequential dependency. Smaller pieces dominate early; larger pieces
// become more common as levels rise (board gets denser so clears matter more).
// weight = how often this piece appears. Higher = more frequent.
const PIECE_DEFS = [
  // 1×1
  { shape: [[1]],                         color: 0, weight: 8  },
  // 1×2
  { shape: [[1,1]],                        color: 1, weight: 12 },
  { shape: [[1],[1]],                      color: 1, weight: 12 },
  // 1×3
  { shape: [[1,1,1]],                      color: 2, weight: 14 },
  { shape: [[1],[1],[1]],                  color: 2, weight: 14 },
  // 1×4
  { shape: [[1,1,1,1]],                    color: 3, weight: 12 },
  { shape: [[1],[1],[1],[1]],              color: 3, weight: 12 },
  // 1×5
  { shape: [[1,1,1,1,1]],                  color: 4, weight: 8  },
  { shape: [[1],[1],[1],[1],[1]],          color: 4, weight: 8  },
  // 2×2
  { shape: [[1,1],[1,1]],                  color: 5, weight: 14 },
  // 3×3
  { shape: [[1,1,1],[1,1,1],[1,1,1]],      color: 9, weight: 5  },
  // Small L (3-cell corner)
  { shape: [[1,0],[1,1]],                  color: 3, weight: 10 },
  { shape: [[0,1],[1,1]],                  color: 3, weight: 10 },
  { shape: [[1,1],[1,0]],                  color: 3, weight: 10 },
  { shape: [[1,1],[0,1]],                  color: 3, weight: 10 },
  // Big L (4-cell)
  { shape: [[1,0],[1,0],[1,1]],            color: 8, weight: 8  },
  { shape: [[0,1],[0,1],[1,1]],            color: 8, weight: 8  },
  { shape: [[1,1],[1,0],[1,0]],            color: 8, weight: 8  },
  { shape: [[1,1],[0,1],[0,1]],            color: 8, weight: 8  },
  { shape: [[1,0,0],[1,1,1]],              color: 0, weight: 8  },
  { shape: [[0,0,1],[1,1,1]],              color: 0, weight: 8  },
  { shape: [[1,1,1],[1,0,0]],              color: 0, weight: 8  },
  { shape: [[1,1,1],[0,0,1]],              color: 0, weight: 8  },
  // T shapes
  { shape: [[1,1,1],[0,1,0]],              color: 1, weight: 8  },
  { shape: [[0,1,0],[1,1,1]],              color: 1, weight: 8  },
  { shape: [[1,0],[1,1],[1,0]],            color: 1, weight: 8  },
  { shape: [[0,1],[1,1],[0,1]],            color: 1, weight: 8  },
  // S/Z shapes
  { shape: [[0,1,1],[1,1,0]],              color: 2, weight: 6  },
  { shape: [[1,1,0],[0,1,1]],              color: 2, weight: 6  },
  { shape: [[1,0],[1,1],[0,1]],            color: 2, weight: 6  },
  { shape: [[0,1],[1,1],[1,0]],            color: 2, weight: 6  },
  // 2×3 / 3×2 blocks
  { shape: [[1,1,1],[1,1,1]],              color: 5, weight: 6  },
  { shape: [[1,1],[1,1],[1,1]],            color: 5, weight: 6  },
];

function buildPiecePool() {
  const pool = [];
  PIECE_DEFS.forEach(d => { for (let i = 0; i < d.weight; i++) pool.push(d); });
  return pool;
}
let _piecePool = buildPiecePool();

function randPiece() {
  const def = _piecePool[Math.floor(Math.random() * _piecePool.length)];
  return { shape: def.shape, color: def.color };
}

function pieceCanFitAnywhere(piece) {
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++)
      if (canPlace(piece, r, c)) return true;
  return false;
}

// ── Board seeding ─────────────────────────────────────────────────────────────
// Block Blast starts nearly empty. We seed a handful of nearly-complete rows/cols
// as immediate combo bait — giving the player wins on the first few moves.
function initBoard() {
  board = Array.from({ length: ROWS }, () => Array(COLS).fill(-1));
  const colors = [0,1,2,3,4,5,6,7,8];
  function rc() { return colors[Math.floor(Math.random() * colors.length)]; }

  // Seed 2-4 nearly-complete rows with a single gap each
  const numRows = 2 + Math.floor(Math.random() * 3);
  const rowOrder = [...Array(ROWS).keys()].sort(() => Math.random() - 0.5);
  rowOrder.slice(0, numRows).forEach(row => {
    for (let c = 0; c < COLS; c++) board[row][c] = rc();
    board[row][Math.floor(Math.random() * COLS)] = -1;
  });

  // Seed 2-4 nearly-complete cols with a single gap each
  const numCols = 2 + Math.floor(Math.random() * 3);
  const colOrder = [...Array(COLS).keys()].sort(() => Math.random() - 0.5);
  colOrder.slice(0, numCols).forEach(col => {
    for (let r = 0; r < ROWS; r++) if (board[r][col] === -1) board[r][col] = rc();
    board[Math.floor(Math.random() * ROWS)][col] = -1;
  });

  // Break any accidentally completed lines
  for (let r = 0; r < ROWS; r++)
    if (board[r].every(v => v !== -1)) board[r][Math.floor(Math.random() * COLS)] = -1;
  for (let c = 0; c < COLS; c++)
    if (board.map(row => row[c]).every(v => v !== -1)) board[Math.floor(Math.random() * ROWS)][c] = -1;
}

// ── Piece generation ──────────────────────────────────────────────────────────
// Each piece MUST fit somewhere on the current board individually.
// No sequential dependency — Block Blast never forces ordering.
// Bias toward pieces that nearly complete a row or column (combo potential).
function generatePieces() {
  const ps = [];
  for (let slot = 0; slot < 3; slot++) {
    let chosen = null;
    // Try to pick a piece with good combo potential (fills a nearly-complete line)
    const candidates = [];
    for (let t = 0; t < 20; t++) {
      const p = randPiece();
      if (pieceCanFitAnywhere(p)) candidates.push(p);
    }
    if (candidates.length > 0) {
      candidates.sort((a, b) => comboPotential(b) - comboPotential(a));
      // Pick from top half to avoid being too mechanical
      const top = candidates.slice(0, Math.max(1, Math.floor(candidates.length / 2)));
      chosen = top[Math.floor(Math.random() * top.length)];
    }
    // Fallback
    if (!chosen) {
      let t = 0;
      do { chosen = randPiece(); t++; } while (!pieceCanFitAnywhere(chosen) && t < 60);
    }
    ps.push(chosen);
  }
  return ps;
}

function comboPotential(piece) {
  let score = 0;
  const ph = piece.shape.length, pw = piece.shape[0].length;
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (!canPlace(piece, r, c)) continue;
      const hitRows = new Set(), hitCols = new Set();
      for (let pr = 0; pr < ph; pr++)
        for (let pc = 0; pc < pw; pc++)
          if (piece.shape[pr][pc]) { hitRows.add(r+pr); hitCols.add(c+pc); }
      hitRows.forEach(row => {
        const gaps = board[row].filter(v => v === -1).length;
        if (gaps <= pw) score += (pw - gaps + 1) * 3;
      });
      hitCols.forEach(col => {
        const gaps = board.map(row => row[col]).filter(v => v === -1).length;
        if (gaps <= ph) score += (ph - gaps + 1) * 3;
      });
    }
  }
  return score;
}
function renderBoard() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.dataset.r = r; cell.dataset.c = c;
      if (board[r][c] !== -1) cell.classList.add('filled', 'c' + board[r][c]);
      grid.appendChild(cell);
    }
  }
}

function renderTray() {
  const tray = document.getElementById('tray');
  tray.innerHTML = '';
  pieces.forEach((p, i) => {
    const slot = document.createElement('div');
    slot.className = 'piece-slot' + (p === null ? ' used' : '');
    if (p) {
      slot.appendChild(buildPieceGrid(p, 20, 2));
      slot.addEventListener('touchstart', e => startDrag(e, i), { passive: false });
      slot.addEventListener('mousedown', e => startDrag(e, i));
    }
    tray.appendChild(slot);
  });
}

function buildPieceGrid(piece, cellSize, gap) {
  const pg = document.createElement('div');
  pg.className = 'piece-grid';
  const rows = piece.shape.length, cols = piece.shape[0].length;
  pg.style.gridTemplateColumns = `repeat(${cols}, ${cellSize}px)`;
  pg.style.gridTemplateRows = `repeat(${rows}, ${cellSize}px)`;
  pg.style.gap = gap + 'px';
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const cell = document.createElement('div');
      cell.className = 'piece-cell';
      if (piece.shape[r][c]) cell.classList.add('filled', 'c' + piece.color);
      pg.appendChild(cell);
    }
  }
  return pg;
}

function updateScore() {
  document.getElementById('score').textContent = score;
  document.getElementById('best').textContent = best;
  document.getElementById('level-val').textContent = level;
}

function startDrag(e, idx) {
  e.preventDefault();
  if (pieces[idx] === null || processing) return;
  soundPickup();
  dragPieceIdx = idx;
  dragging = pieces[idx];
  const ghost = document.getElementById('ghost');
  const ghostGrid = document.getElementById('ghost-grid');
  ghostGrid.innerHTML = '';
  const cols = dragging.shape[0].length;
  // Match ghost cell size exactly to the live board cell size
  const cellSize = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--cell')) || 38;
  ghostGrid.style.gridTemplateColumns = `repeat(${cols}, ${cellSize}px)`;
  ghostGrid.style.gridTemplateRows = `repeat(${dragging.shape.length}, ${cellSize}px)`;
  ghostGrid.style.gap = '2px';
  for (let r = 0; r < dragging.shape.length; r++) {
    for (let c = 0; c < cols; c++) {
      const cell = document.createElement('div');
      cell.className = 'piece-cell';
      if (dragging.shape[r][c]) cell.classList.add('filled', 'c' + dragging.color);
      ghostGrid.appendChild(cell);
    }
  }
  const pt = e.touches ? e.touches[0] : e;
  ghost.style.display = 'block';
  positionGhost(pt.clientX, pt.clientY);
  document.addEventListener('touchmove', onDragMove, { passive: false });
  document.addEventListener('touchend', onDragEnd);
  document.addEventListener('mousemove', onDragMove);
  document.addEventListener('mouseup', onDragEnd);
}

// Single source of truth: where the ghost's top-left pixel should be.
// Uses the live board --cell size so ghost always matches the grid exactly.
// When over the board, highlightCells overrides this with a snapped position.
function ghostTopLeft(x, y, piece) {
  const p = piece || dragging;
  const cellSize = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--cell')) || 38;
  const cols = p.shape[0].length, rows = p.shape.length;
  const W = cols * cellSize + (cols - 1) * 2;
  const H = rows * cellSize + (rows - 1) * 2;
  return { left: x - W / 2, top: y - H / 2 - 60 };
}

function positionGhost(x, y) {
  const { left, top } = ghostTopLeft(x, y);
  const ghost = document.getElementById('ghost');
  ghost.style.left = left + 'px';
  ghost.style.top  = top  + 'px';
}

function onDragMove(e) {
  e.preventDefault();
  const pt = e.touches ? e.touches[0] : e;
  positionGhost(pt.clientX, pt.clientY);
  highlightCells(pt.clientX, pt.clientY);
}

async function onDragEnd(e) {
  // Remove listeners immediately so a second fire (touchend + mouseup on mobile)
  // cannot re-enter this handler for the same gesture.
  document.removeEventListener('touchmove', onDragMove);
  document.removeEventListener('touchend', onDragEnd);
  document.removeEventListener('mousemove', onDragMove);
  document.removeEventListener('mouseup', onDragEnd);

  const pt = e.changedTouches ? e.changedTouches[0] : e;
  clearHighlight();
  document.getElementById('ghost').style.display = 'none';
  document.getElementById('ghost').classList.remove('valid', 'invalid');

  const currentDragging = dragging;
  const currentIdx = dragPieceIdx;
  dragging = null; dragPieceIdx = -1;

  if (!currentDragging || processing) return;

  const anchor = getCenterAnchor(pt.clientX, pt.clientY, currentDragging);
  const placed = anchor ? tryPlace(currentDragging, anchor.r, anchor.c) : false;
  if (placed) {
    processing = true;
    pieces[currentIdx] = null;
    await checkAndClearLines();
    if (pieces.every(p => p === null)) {
      // Defer expensive sequential validation so board paint isn't blocked
      await new Promise(resolve => setTimeout(resolve, 0));
      pieces = generatePieces();
      comboCount = 0;
    }
    renderTray();
    if (!levelUpInProgress && !hasAnyValidMove()) triggerGameOver();
    processing = false;
  } else {
    comboCount = 0;
    if (anchor) playTone('sine', 220, 0.12, 0.2);
  }
}

function getBoardCellAt(x, y) {
  const grid = document.getElementById('grid');
  const rect = grid.getBoundingClientRect();
  const cellSize = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--cell')) || 38;
  const gap = 2, pad = 6;
  const ox = x - rect.left - pad, oy = y - rect.top - pad;
  const step = cellSize + gap;
  const c = Math.floor(ox / step), r = Math.floor(oy / step);
  if (r >= 0 && r < ROWS && c >= 0 && c < COLS) return { r, c };
  return null;
}

function getCenterAnchor(x, y, piece) {
  const { left: ghostLeft, top: ghostTop } = ghostTopLeft(x, y, piece);
  const grid = document.getElementById('grid');
  const rect = grid.getBoundingClientRect();
  const cellSize = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--cell')) || 38;
  const step = cellSize + 2;
  const pad  = 6;

  const anchorC = Math.round((ghostLeft - rect.left - pad) / step);
  const anchorR = Math.round((ghostTop  - rect.top  - pad) / step);

  if (canPlace(piece, anchorR, anchorC)) {
    return { r: anchorR, c: anchorC, valid: true };
  }

  for (let dr = -1; dr <= 1; dr++) {
    for (let dc = -1; dc <= 1; dc++) {
      if (dr === 0 && dc === 0) continue;
      if (canPlace(piece, anchorR + dr, anchorC + dc)) {
        return { r: anchorR + dr, c: anchorC + dc, valid: true };
      }
    }
  }

  return { r: anchorR, c: anchorC, valid: false };
}

function highlightCells(x, y) {
  clearHighlight();
  if (!dragging) return;

  const ghost = document.getElementById('ghost');
  const grid = document.getElementById('grid');
  const rect = grid.getBoundingClientRect();
  const cellSize = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--cell')) || 38;
  const step = cellSize + 2;
  const pad  = 6;

  // Ghost always follows the finger — never force-snap it to a valid cell
  positionGhost(x, y);

  // Compute raw anchor from ghost top-left position
  const { left: ghostLeft, top: ghostTop } = ghostTopLeft(x, y);
  const anchorC = Math.round((ghostLeft - rect.left - pad) / step);
  const anchorR = Math.round((ghostTop  - rect.top  - pad) / step);

  // Check if the raw anchor position is valid
  const valid = canPlace(dragging, anchorR, anchorC);
  ghost.classList.remove('valid', 'invalid');

  // Only show a colour and highlight when we're close enough to the board
  // to be a meaningful placement (piece overlaps the grid area)
  const overBoard = anchorR > -dragging.shape.length && anchorR < ROWS &&
                    anchorC > -dragging.shape[0].length && anchorC < COLS;
  if (!overBoard) return;

  ghost.classList.add(valid ? 'valid' : 'invalid');

  for (let r = 0; r < dragging.shape.length; r++) {
    for (let c = 0; c < dragging.shape[0].length; c++) {
      if (!dragging.shape[r][c]) continue;
      const gr = anchorR + r, gc = anchorC + c;
      if (gr < 0 || gr >= ROWS || gc < 0 || gc >= COLS) continue;
      const cell = grid.children[gr * COLS + gc];
      if (cell) cell.classList.add(valid ? 'highlight' : 'invalid');
    }
  }
}

function clearHighlight() {
  document.querySelectorAll('.cell.highlight, .cell.invalid').forEach(c => c.classList.remove('highlight', 'invalid'));
}

function canPlace(piece, r, c) {
  for (let pr = 0; pr < piece.shape.length; pr++) {
    for (let pc = 0; pc < piece.shape[0].length; pc++) {
      if (!piece.shape[pr][pc]) continue;
      const gr = r + pr, gc = c + pc;
      if (gr < 0 || gr >= ROWS || gc < 0 || gc >= COLS || board[gr][gc] !== -1) return false;
    }
  }
  return true;
}

function tryPlace(piece, anchorR, anchorC) {
  if (!canPlace(piece, anchorR, anchorC)) return false;
  let cellCount = 0;
  const gridEl = document.getElementById('grid');
  for (let pr = 0; pr < piece.shape.length; pr++) {
    for (let pc = 0; pc < piece.shape[0].length; pc++) {
      if (!piece.shape[pr][pc]) continue;
      const gr = anchorR + pr, gc = anchorC + pc;
      board[gr][gc] = piece.color;
      cellCount++;
      // Surgically update only the placed cells — no full renderBoard() so
      // these DOM elements stay alive for the clearing animation to grab them.
      const cell = gridEl.children[gr * COLS + gc];
      if (cell) {
        cell.className = 'cell filled c' + piece.color;
      }
    }
  }
  soundDrop();
  addScore(cellCount, false, null);
  return true;
}

function checkAndClearLines() {
  const rowsToClear = [], colsToClear = [];
  for (let r = 0; r < ROWS; r++) if (board[r].every(v => v !== -1)) rowsToClear.push(r);
  for (let c = 0; c < COLS; c++) if (board.map(row => row[c]).every(v => v !== -1)) colsToClear.push(c);
  const totalLines = rowsToClear.length + colsToClear.length;
  if (totalLines === 0) { comboCount = 0; return Promise.resolve(); }
  comboCount++;

  const cellsToClear = new Set();
  rowsToClear.forEach(r => { for (let c = 0; c < COLS; c++) cellsToClear.add(r * COLS + c); });
  colsToClear.forEach(c => { for (let r = 0; r < ROWS; r++) cellsToClear.add(r * COLS + c); });

  return new Promise(resolve => {
    // Wait one rAF so the browser paints the just-placed cells in their correct
    // color before we add .clearing and fire the shake. This ensures the new
    // blocks visually settle into place before animating with the cleared line.
    requestAnimationFrame(() => {
      soundLineClear(totalLines);
      if (comboCount >= 2) setTimeout(() => soundCombo(comboCount), 200);

      // Shake the grid — intensity scales with lines cleared and combo
      const gridWrap = document.getElementById('grid-wrap');
      const shakeClass = (totalLines >= 4 || comboCount >= 3) ? 'shake-lg'
                       : (totalLines >= 2 || comboCount >= 2) ? 'shake-md'
                       : 'shake-sm';
      gridWrap.classList.remove('shake-sm', 'shake-md', 'shake-lg');
      void gridWrap.offsetWidth;
      gridWrap.classList.add(shakeClass);
      gridWrap.addEventListener('animationend', () => {
        gridWrap.classList.remove('shake-sm', 'shake-md', 'shake-lg');
      }, { once: true });

      const gridEl = document.getElementById('grid');
      cellsToClear.forEach(idx => {
        const cell = gridEl.children[idx];
        if (cell) cell.classList.add('clearing');
      });

      setTimeout(() => {
        rowsToClear.forEach(r => { for (let c = 0; c < COLS; c++) board[r][c] = -1; });
        colsToClear.forEach(c => { for (let r = 0; r < ROWS; r++) board[r][c] = -1; });
        const cleared = rowsToClear.length * COLS + colsToClear.length * ROWS - rowsToClear.length * colsToClear.length;
        addScore(cleared, true, totalLines);
        renderBoard();
        resolve();
      }, 350);
    });
  });
}

function addScore(cells, isLine, lineCount) {
  let pts = cells * 2; // 2 points per cell placed
  if (isLine) {
    pts += lineCount * 10; // 10 bonus per line cleared
    if (comboCount > 1) pts += (comboCount - 1) * 20; // combo bonus
  }
  const prevLevel = Math.floor(score / LEVEL_THRESHOLD) + 1;
  score += pts;
  const newLevel = Math.floor(score / LEVEL_THRESHOLD) + 1;
  if (score > best) { best = score; localStorage.setItem('seb_blast_best', best); }
  updateScore();
  if (isLine) { showCombo(lineCount); showScorePop(pts); }
  if (newLevel > prevLevel) triggerLevelUp(newLevel);
}

function triggerLevelUp(newLevel) {
  level = newLevel;
  _piecePool = buildPiecePool();
  updateScore();
  showPopup('🚀 Level ' + newLevel + '!');
  soundLineClear(4);
  levelUpInProgress = true;
  setTimeout(() => {
    initBoard();
    pieces = generatePieces();
    renderBoard();
    renderTray();
    levelUpInProgress = false;
  }, 700);
}

let _popToggle = 0;

function showPopup(text) {
  document.querySelectorAll('.sebtacular-pop').forEach(el => el.remove());
  const pop = document.createElement('div');
  pop.className = 'sebtacular-pop';
  const span = document.createElement('span');
  span.textContent = text;
  pop.appendChild(span);
  document.body.appendChild(pop);
  pop.addEventListener('animationend', () => pop.remove());
}

function showCombo(lines) {
  const el = document.getElementById('combo');
  let msg = '';
  if (lines >= 3) {
    showPopup('💥 Siuperb! 💥');
    msg = '💥 Siuperb!';
  } else if (lines >= 2) {
    const isSeb = _popToggle % 2 === 0;
    _popToggle++;
    showPopup(isSeb ? '✨ Sebtacular! ✨' : '💫 Lawsome! 💫');
    msg = isSeb ? 'Sebtacular! 🚀' : '💫 Lawsome!';
  }
  if (comboCount >= 2) msg += (msg ? ' ' : '') + `×${comboCount} COMBO!`;
  if (msg) {
    el.textContent = msg;
    setTimeout(() => { el.textContent = ''; }, 2000);
  } else {
    el.textContent = '';
  }
}

function showScorePop(pts) {
  const wrap = document.getElementById('grid-wrap');
  const pop = document.createElement('div');
  pop.className = 'score-pop';
  pop.textContent = '+' + pts;
  pop.style.top = Math.random() * 40 + 30 + '%';
  pop.style.left = Math.random() * 50 + 25 + '%';
  wrap.appendChild(pop);
  pop.addEventListener('animationend', () => pop.remove());
}

function hasAnyValidMove() {
  // Game over only when every remaining piece has no valid position on the board.
  // If even one piece can be placed anywhere, the game continues.
  return pieces.some(p => p !== null && pieceCanFitAnywhere(p));
}

function initGame() {
  score = 0; comboCount = 0; level = 1; levelUpInProgress = false; processing = false;
  _piecePool = buildPiecePool();
  best = parseInt(localStorage.getItem('seb_blast_best') || '0');
  initBoard();
  pieces = generatePieces();
  renderBoard(); renderTray(); updateScore();
  document.getElementById('gameover').classList.remove('show');
  // Update badge
  const badge = document.getElementById('mode-badge');
  if (badge) { badge.style.display = 'none'; }
}

function triggerGameOver() {
  soundGameOver();
  if (score > best) { best = score; localStorage.setItem('seb_blast_best', best); }
  document.getElementById('final-score').textContent = score;
  document.getElementById('final-best').textContent = best;
  setTimeout(() => document.getElementById('gameover').classList.add('show'), 400);
}

document.getElementById('restart-btn').addEventListener('click', () => {
  document.getElementById('gameover').classList.remove('show');
  initGame();
});

function setResponsiveCellSize() {
  const vw = window.innerWidth;
  const vh = window.innerHeight;
  const gridSpace = Math.min(vw - 20, vh * 0.54);
  const cell = Math.floor((gridSpace - 12 - 7 * 2) / 8);
  document.documentElement.style.setProperty('--cell', cell + 'px');
}
window.addEventListener('resize', () => { setResponsiveCellSize(); renderBoard(); renderTray(); });
setResponsiveCellSize();
initGame(); // Start immediately
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => { navigator.serviceWorker.register("./sw.js").catch(()=>{}); });
}
</script>
